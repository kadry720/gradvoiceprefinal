        <rect x="126" y="22" width="8" height="36" rx="4" fill="#7C5CFF"/>
        <rect x="144" y="4" width="8" height="72" rx="4" fill="#49E39F"/>
        <rect x="162" y="20" width="8" height="40" rx="4" fill="#18C7D4"/>
