<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GradVoice product banner</title>
  <desc id="desc">A polished dashboard-style banner showing CV analysis, match scoring, and live voice screening for GradVoice.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.48" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>

    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(274 150) rotate(43) scale(590 340)">
      <stop stop-color="#7C5CFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1244 238) rotate(139) scale(540 320)">
      <stop stop-color="#10BBD5" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#10BBD5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="surface" x1="220" y1="140" x2="1450" y2="830" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172033" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0C1321" stop-opacity="0.96"/>
    </linearGradient>

    <linearGradient id="surfaceSoft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8B6CFF"/>
      <stop offset="0.5" stop-color="#18C7D4"/>
      <stop offset="1" stop-color="#49E39F"/>
    </linearGradient>

    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F8B84E"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#000000" flood-opacity="0.42"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <clipPath id="screenClip">
      <rect x="595" y="152" width="770" height="596" rx="34"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glowViolet)"/>
  <rect width="1600" height="900" fill="url(#glowCyan)"/>

  <g opacity="0.18">
